name: Update README from CSV

on:
  push:
    paths:
      - "data.csv"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Markdown table
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          csv_file = Path("data.csv")
          readme_file = Path("README.md")

          # Read CSV
          with csv_file.open(newline="", encoding="utf-8-sig") as f:
              rows = list(csv.reader(f))

          headers = rows[0]
          data = rows[1:]

          # Remove completely empty columns at the end
          while headers and not headers[-1].strip():
              headers.pop()
              data = [row[:-1] if row else row for row in data]

          # Build Markdown table
          table = []

          def clean(value):
              return (
                  value
                  .replace("|", "\\|")
                  .replace("\n", " ")
                  .strip()
              )

          table.append(
              "| " + " | ".join(clean(h) for h in headers) + " |"
          )

          table.append(
              "| " + " | ".join("---" for _ in headers) + " |"
          )

          for row in data:
              row = row + [""] * (len(headers) - len(row))
              row = row[:len(headers)]

              table.append(
                  "| " + " | ".join(clean(cell) for cell in row) + " |"
              )

          table = "\n".join(table)

          # Update README between markers
          readme = readme_file.read_text(encoding="utf-8")

          start = "<!-- CSV_TABLE_START -->"
          end = "<!-- CSV_TABLE_END -->"

          if start not in readme or end not in readme:
              raise SystemExit(
                  "README.md is missing CSV_TABLE_START or CSV_TABLE_END"
              )

          before = readme.split(start, 1)[0]
          after = readme.split(end, 1)[1]

          new_readme = (
              before
              + start
              + "\n\n"
              + table
              + "\n\n"
              + end
              + after
          )

          readme_file.write_text(new_readme, encoding="utf-8")
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date"
          else
            git commit -m "Update README from CSV"
            git push
          fi
